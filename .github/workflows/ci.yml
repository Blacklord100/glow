name: Build and checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS build and focus checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; verified against actions/checkout tag
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build app
        run: swift build -c release --product Glow
      - name: Check focus accounting
        run: swift run GlowChecks
